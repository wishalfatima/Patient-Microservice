version: '3.8'

services:
  mongodb:
    image: mongo:5.0
    container_name: patient-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  patient-service:
    build: .
    depends_on:
      - mongodb
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/patientdb
    # Wait for MongoDB to be ready, can add a wait-for script here if needed

volumes:
  mongo_data:
